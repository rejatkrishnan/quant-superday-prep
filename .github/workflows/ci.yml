name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Check index.html cache-busting stamps are up to date
        run: node tools/stamp.mjs --check
      - name: Validate question banks, parser and generators
        run: node tests/validate.mjs
      - name: Check every coding problem's reference solution passes its tests
        run: |
          node tests/export_coding.mjs > coding.json
          python tests/run_coding_tests.py coding.json
